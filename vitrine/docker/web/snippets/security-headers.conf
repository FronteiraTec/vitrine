# Cabeçalhos de segurança de toda resposta.
#
# Incluído no `server` E em cada `location` que tem `add_header` próprio: no
# Nginx, um `add_header` dentro de um bloco faz ele deixar de herdar TODOS os do
# bloco de fora — sem repetir aqui, o cache de /assets/ apagaria estes.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
