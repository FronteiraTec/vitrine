# Repasse para a API.
#
# O IP do visitante segue em X-Forwarded-For: a API confia em UM proxy (este
# Nginx, `TRUST_PROXY=1`) e lê o último endereço da lista, o que o próprio
# Nginx acrescentou. É desse IP que sai o país do relatório de audiência — e
# o limite de tentativas de login.
proxy_pass http://vitrine_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
# $http_host, e não $host: com porta fora da 80/443 (HTTP_PORT=8080), $host
# perderia a porta, e a checagem de origem da API recusaria toda gravação.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_read_timeout 60s;
