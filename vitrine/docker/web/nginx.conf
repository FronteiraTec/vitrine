# =============================================================================
# Vitrine — Nginx
#
# Serve o React construído e os arquivos enviados pelo painel, e repassa à API
# só o que é dela:
#
#   /api/…                              API (JSON)
#   /noticia/:slug, /en/news/:slug…     notícia com o <head> escrito no servidor
#   /noticias, /en/news, /es/noticias   lista de notícias, idem
#   /sitemap*.xml, /rss.xml, /feed.xml  gerados a cada requisição
#
# Todo o resto é a SPA: arquivo estático se existir, senão o index.html.
#
# Este arquivo é incluído DENTRO do bloco `http` do nginx.conf da imagem, por
# isso as zonas de limite e o `map` podem ficar aqui em cima.
# =============================================================================

# Limite de tentativas de login, cadastro e senha — só nos POST. O GET da
# sessão, chamado a cada página do painel, fica fora: uma chave vazia não conta.
map $request_method $auth_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $auth_limit_key zone=auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

# Protocolo original quando há outro proxy à frente (que termina o HTTPS).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream vitrine_api {
    server api:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Imagens de até 5 MB, mais a folga do multipart.
    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/xml application/rss+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    # --- API ------------------------------------------------------------------

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    # --- Páginas renderizadas no servidor ------------------------------------

    location ~ ^/(noticia|en/news|es/noticia)/[^/]+$ {
        include /etc/nginx/snippets/proxy.conf;
    }

    location ~ ^/(noticias|en/news|es/noticias)$ {
        include /etc/nginx/snippets/proxy.conf;
    }

    location ~ ^/(sitemap(-paginas|-noticias|-google-news)?\.xml|rss\.xml|feed\.xml)$ {
        include /etc/nginx/snippets/proxy.conf;
    }

    # --- Arquivos enviados pelo painel ----------------------------------------
    #
    # Nome com sufixo único a cada envio: o arquivo nunca muda, e o cache pode
    # ser de um ano. A política de conteúdo isola qualquer coisa aberta direto
    # pela URL — um SVG com script, por exemplo, não executa nada aqui.
    location /arquivos/ {
        alias /data/arquivos/;
        autoindex off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
    }

    # --- SPA ------------------------------------------------------------------

    # Arquivos do build com hash no nome.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # A casca: sempre revalidada, para um deploy novo valer na hora.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
